# 읽기/쓰기 분리 DataSource. 테스트는 primary/replica/analytics 모두 동일 H2 인메모리 DB 를
# 가리켜 라우팅은 동작하되 데이터는 공유된다(degenerate split). 3노드 라우팅 통합 테스트는
# @DynamicPropertySource 로 실제 컨테이너 url 을 덮어쓴다.
datasource:
  primary:
    url: jdbc:h2:mem:fretboard;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  replica:
    url: jdbc:h2:mem:fretboard;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  analytics:
    url: jdbc:h2:mem:fretboard;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

spring:
  datasource:
    url: jdbc:h2:mem:fretboard;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

cloud:
  aws:
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket
      image-base-uri: https://test-bucket.s3.amazonaws.com/
      temporary-storage-path: temp/
      image-storage-path: images/

popular:
  weights: { view: 1, like: 3, comment: 2 }
  like-threshold: 10
  today-limit: 10
  today-ttl: 2d

security:
  jwt:
    token:
      secret-key: test-jwt-token-secret-key-for-ci-only
      expire-length: 3600000
    refresh:
      secret-key: test-jwt-refresh-secret-key-for-ci-only
      expire-length: 1209600000