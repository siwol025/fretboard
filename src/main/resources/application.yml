spring:
  application:
    name: FretBoard

  profiles:
    active: dev

#  jpa:
#    properties:
#      hibernate:
#        default_batch_fetch_size: 100

popular:
  weights: { view: 1, like: 3, comment: 2 }
  like-threshold: 10
  today-limit: 10
  today-ttl: 2d

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

