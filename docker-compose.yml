version: "3.8"

services:
  app:
    image: fretboard-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fretboard-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - redis
      - mysql

  redis:
    image: redis:7-alpine
    container_name: fretboard-redis
    ports:
      - "6379:6379"
    restart: always

  # --- 단일 MySQL (읽기/쓰기 분리 제거 후 단일 노드) ---
  mysql:
    image: mysql:8.4
    container_name: fretboard-mysql
    environment:
      MYSQL_ROOT_PASSWORD: fretboard
      MYSQL_DATABASE: fretboard          # 빈 스키마 생성 후 Flyway 가 마이그레이션
    ports:
      - "3307:3306"                      # host 3306 은 로컬 네이티브 MySQL 점유 가능 → 3307 로 공존
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: always

volumes:
  mysql-data:
